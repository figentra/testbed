# Testbed file contract:
# Purpose: proves a testbed image change before the owner spends an image build on it (STA-1953): builds the job image
#          from images/job/Dockerfile at its pinned defaults, runs the `testbed-images` component's own validate
#          commands against it, and warms a pnpm store, with no environment, from the four install files WarmStore
#          uploads, read from a sparse checkout of figentra/stackra at main, then fetches offline from it, as the
#          image's validate phase does. It also runs the package tests with CORE_CHECKOUT set, so the toolchain pins
#          are checked against core's mise.toml and catalogue. Daily as well as on pull requests, because core's
#          lockfile and pins move without a change here. Advisory, never a required check (ADR 0166 CI2).
# Secrets: none. Like the image build instance, the job has no token; the figentra/stackra checkout is public.
# Owner: release-operations

name: Testbed image

on:
  pull_request:
    paths:
      - packages/testbed/images/**
      - packages/testbed/src/core/constants/toolchain-pins.constant.ts
      - .github/workflows/testbed-image.yml
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: testbed-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    name: Testbed image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CORE_CHECKOUT: ${{ github.workspace }}/core
    defaults:
      run:
        working-directory: packages/testbed
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false

      # The four files WarmStore uploads, plus core's mise.toml for the pin test; nothing else.
      - name: Checkout figentra/stackra install files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: figentra/stackra
          ref: main
          path: core
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /.pnpmfile.mjs
            /.npmrc
            /mise.toml

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      # The job image with three browsers and the core store do not fit the runner's free disk otherwise.
      - name: Disk
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Pins equal core
        working-directory: ${{ github.workspace }}
        run: |
          echo "::notice title=Core install files::figentra/stackra at $(git -C core rev-parse HEAD)"
          pnpm install --frozen-lockfile
          pnpm --filter @figentra/testbed test

      # No build context, as the `testbed-images` component builds it; the ARG defaults equal TOOLCHAIN_PINS (a unit
      # test keeps them so).
      - name: Job image
        run: docker build -t stackra-testbed-job:current - < images/job/Dockerfile

      - name: Job image checks (the component's validate phase)
        run: |
          arg() { sed -n "s/^ARG $1=//p" images/job/Dockerfile; }
          postgres=$(sed -n 's/^ *postgresImage: "\(.*\)",$/\1/p' src/core/constants/toolchain-pins.constant.ts)
          docker pull "$postgres"
          yq '.phases[] | select(.name == "validate") | .steps[].inputs.commands[]' \
            images/host/components/02-images.yml \
            | sed -e "s|@@NODE@@|$(arg NODE_VERSION)|g" -e "s|@@PNPM@@|$(arg PNPM_VERSION)|g" \
              -e "s|@@INFISICAL@@|$(arg INFISICAL_VERSION)|g" -e "s|@@SHFMT@@|$(arg SHFMT_VERSION)|g" \
              -e "s|@@ENCORE@@|$(arg ENCORE_VERSION)|g" -e "s|@@PLAYWRIGHT@@|$(arg PLAYWRIGHT_VERSION)|g" \
              -e "s|@@POSTGRES@@|$postgres|g" > "$RUNNER_TEMP/validate.sh"
          if grep -n '@@' "$RUNNER_TEMP/validate.sh"; then echo "::error::an unfilled placeholder"; exit 1; fi
          bash "$RUNNER_TEMP/validate.sh"

      # WarmStore and its offline check (03-agent.yml), from a shell with no environment: the build instance has no
      # licence token, so a fetch that ran an install script would fail here as it did there. node and pnpm are the
      # image's own pins (the Dockerfile's ARG defaults), not this repository's.
      - name: Warm store with no environment
        run: |
          arg() { sed -n "s/^ARG $1=//p" images/job/Dockerfile; }
          node_tool="node@$(arg NODE_VERSION)"
          pnpm_tool="pnpm@$(arg PNPM_VERSION)"
          mise install "$node_tool" "$pnpm_tool"
          node_bin=$(dirname "$(mise which node --tool "$node_tool")")
          tools="$(dirname "$(mise which pnpm --tool "$pnpm_tool")"):$node_bin:/usr/bin:/bin"
          warm=$RUNNER_TEMP/warm
          mkdir -p "$warm" "$RUNNER_TEMP/home"
          cp "$CORE_CHECKOUT"/{pnpm-lock.yaml,pnpm-workspace.yaml,.pnpmfile.mjs,.npmrc} "$warm/"
          cd "$warm"
          env -i PATH="$tools" HOME="$RUNNER_TEMP/home" pnpm fetch --ignore-scripts --store-dir "$RUNNER_TEMP/store"
          rm -rf node_modules
          env -i PATH="$tools" HOME="$RUNNER_TEMP/home" \
            pnpm fetch --offline --ignore-scripts --store-dir "$RUNNER_TEMP/store" >/dev/null
