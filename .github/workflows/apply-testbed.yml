# Testbed file contract:
# Purpose: apply the testbed (ADR 0484, ADR 0522, STA-1626, STA-2073) with Pulumi from CI only, by hand: build
#          @figentra/testbed (tests run on the box, STA-2064), then `pulumi preview`, `pulumi up`, or a run of the image pipeline, against one region's
#          stack `testbed-<region>` of packages/testbed/pulumi in the academorix AWS account (591473336656). eu-west-1
#          is the home: its stack holds the global roles and the image pipeline, whose distribution copies each AMI to
#          all four regions; the others hold their pool only (STA-2042). The image's install files (pnpm-lock.yaml,
#          pnpm-workspace.yaml, .pnpmfile.mjs, .npmrc) come from a read-only sparse checkout of figentra/stackra at
#          `core_ref`, passed to the program as the `lockfilePath` config.
# Boundary: workflow_dispatch only, main only, in the `testbed` environment (restricted to main, required reviewer:
#           the owner approves every run). The stack must exist, unless the owner ticks new_stack for a member region
#           not yet set up; a missing stack otherwise fails the run instead of starting an empty one. Creates the
#           private, versioned state bucket if it is gone.
# Runtime: GitHub Actions
# Governing contract: ADR 0484, ADR 0522, ADR 0171 (decisions 4 and 6), ADR 0019, ADR 0173 (all in figentra/stackra).
# Owner: release-operations
# Secrets: none. AWS access is GitHub OIDC into the role in the `testbed` environment variable TESTBED_DEPLOY_ROLE_ARN
#          (trusts this repository's `testbed` environment, and figentra/stackra's until the cut-over, ADR 0522). The
#          stack config is ids, CIDRs and a path, no secret, so the Pulumi passphrase is empty by design. The Infisical
#          ids come from the organization variables.
#          The figentra/stackra checkout is public and read-only, with no credential.
name: Apply testbed

on:
  workflow_dispatch:
    inputs:
      action:
        description: "preview, up, or build-image (start the image pipeline once)"
        type: choice
        options: [preview, up, build-image]
        default: preview
      region:
        description: "The region's stack, testbed-<region> (STA-2042). eu-west-1 is the home: apply it first; build-image runs there only"
        type: choice
        options: [eu-west-1, eu-west-2, eu-central-1, us-east-1]
        default: eu-west-1
      core_ref:
        description: "The figentra/stackra ref whose install files the image warms its store from (a branch, tag or SHA)"
        type: string
        default: main
      new_stack:
        description: "Create testbed-<region> first (once, for a member region not yet set up; never the home region)"
        type: boolean
        default: false
      groups:
        description: "Declare the Auto Scaling groups (untick only before the first image exists)"
        type: boolean
        default: true
      heavy_min:
        description: "Heavy group minimum: 0, so the image build fits the on-demand quota (ADR 0516)"
        type: choice
        options: ["0"]
        default: "0"
      light_min:
        description: "Light group minimum: 0, boxes start on demand (ADR 0516)"
        type: choice
        options: ["0", "1"]
        default: "0"

concurrency:
  group: apply-testbed-${{ inputs.region }}
  cancel-in-progress: false

permissions: {}

jobs:
  apply:
    name: Apply testbed (${{ inputs.action }}, ${{ inputs.region }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: testbed
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, exchanged with AWS STS for the deploy role
    env:
      AWS_REGION: eu-west-1
      ROLE_ARN: ${{ vars.TESTBED_DEPLOY_ROLE_ARN }}
      SSH_CIDRS: ${{ vars.TESTBED_SSH_CIDRS }}
      IDENTITY_ID: ${{ vars.INFISICAL_GATE_IDENTITY_ID }}
      PROJECT_ID: ${{ vars.INFISICAL_GATE_PROJECT_ID }}
      # Optional: the permissions boundary the program sets on the roles it creates (notes testbed-boundary draft).
      PERMISSIONS_BOUNDARY: ${{ vars.TESTBED_PERMISSIONS_BOUNDARY_ARN }}
      STATE_BUCKET: stackra-pulumi-state-591473336656
      PULUMI_TOOL: pulumi@3.268.0
      PULUMI_SKIP_UPDATE_CHECK: "true"
      PULUMI_CONFIG_PASSPHRASE: "" # the stack holds no secret (see Secrets above)
      REGION: ${{ inputs.region }}
      STACK: testbed-${{ inputs.region }}
      HOME_REGION: eu-west-1
      ACTION: ${{ inputs.action }}
      NEW_STACK: ${{ inputs.new_stack }}
      DECLARE_GROUPS: ${{ inputs.groups }}
      HEAVY_MIN: ${{ inputs.heavy_min }}
      LIGHT_MIN: ${{ inputs.light_min }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false

      # The four files the image hashes and warms its store from (testbedInputs), plus core's mise.toml; nothing else.
      - name: Checkout figentra/stackra install files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: figentra/stackra
          ref: ${{ inputs.core_ref }}
          path: core
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /.pnpmfile.mjs
            /.npmrc
            /mise.toml

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      - name: Prerequisites
        run: |
          for name in ROLE_ARN IDENTITY_ID PROJECT_ID; do
            [ -n "${!name}" ] || { echo "::error title=$name::missing (docs/runbook.md, Step 2)"; exit 1; }
          done
          # One image pipeline, in the home region; its distribution copies each AMI to every region (STA-2042).
          if [ "$ACTION" = build-image ] && [ "$REGION" != "$HOME_REGION" ]; then
            echo "::error title=build-image::runs in the home region ($HOME_REGION) only; its build reaches every region"
            exit 1
          fi
          # Recorded so two previews can be compared at one core commit.
          echo "::notice title=Core install files::figentra/stackra at $(git -C core rev-parse HEAD)"
          mise install "$PULUMI_TOOL"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @figentra/testbed build

      - name: AWS (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: apply-testbed-${{ github.run_id }}

      # Pulumi's S3 backend locks with objects in the bucket itself, so no lock table is needed.
      - name: State bucket
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
          fi

      - name: Pulumi ${{ inputs.action }}
        working-directory: packages/testbed/pulumi
        run: |
          set -euo pipefail
          pulumi() { mise exec "$PULUMI_TOOL" -- pulumi --non-interactive "$@"; }
          pulumi login "s3://$STATE_BUCKET?region=$AWS_REGION"
          # Never --create: a missing stack (a typo, a lost login) must not silently become an empty one. A member region
          # not yet set up is created only when the owner ticks new_stack, and never the home region, whose stack holds
          # the roles and the image pipeline.
          if ! pulumi stack select "$STACK"; then
            if [ "$NEW_STACK" = true ] && [ "$REGION" != "$HOME_REGION" ] && [ "$ACTION" != build-image ]; then
              pulumi stack init "$STACK"
              echo "::notice title=Stack::created $STACK for a new member region"
            else
              echo "::error title=Stack::$STACK does not exist in s3://$STATE_BUCKET; tick new_stack only for a new member region"
              exit 1
            fi
          fi
          pulumi config set region "$REGION"
          pulumi config set identityId "$IDENTITY_ID"
          pulumi config set ciGateProjectId "$PROJECT_ID"
          pulumi config set lockfilePath "$GITHUB_WORKSPACE/core/pnpm-lock.yaml"
          # TESTBED_SSH_CIDRS is optional: a comma-separated port-22 allowlist for `testbed --ssh-direct` only.
          # Unset, the boxes have no inbound rule and the CLI reaches them through SSM Session Manager (STA-1953).
          i=0
          for cidr in $(printf '%s' "$SSH_CIDRS" | tr ',' ' '); do
            pulumi config set --path "sshCidrs[$i]" "$cidr"
            i=$((i + 1))
          done
          pulumi config set groups "$DECLARE_GROUPS"
          if [ -n "$PERMISSIONS_BOUNDARY" ]; then pulumi config set permissionsBoundary "$PERMISSIONS_BOUNDARY"; fi
          pulumi config set heavyMin "$HEAVY_MIN"
          pulumi config set lightMin "$LIGHT_MIN"
          # Image Builder components and recipes are kept in AWS when replaced (retainOnDelete, STA-1953). The engine
          # reads that flag from the state, so a version created before the flag existed gets it here once; without it,
          # the replace asks AWS to delete a version an image uses, which AWS refuses. Idempotent: no change, no import.
          if [ "$ACTION" = up ]; then
            state="$RUNNER_TEMP/testbed-state.json"
            versions='(.type == "aws:imagebuilder/component:Component" or .type == "aws:imagebuilder/imageRecipe:ImageRecipe")'
            pulumi stack export --file "$state"
            if jq -e "[.deployment.resources[] | select($versions and .retainOnDelete != true)] | length > 0" "$state" >/dev/null; then
              jq "(.deployment.resources[] | select($versions)).retainOnDelete = true" "$state" > "$state.retained"
              pulumi stack import --file "$state.retained"
              echo "::notice title=State::kept the existing Image Builder versions in AWS on replace (retainOnDelete)"
            fi
            rm -f "$state" "$state.retained"
          fi
          case "$ACTION" in
            up) pulumi up --yes --diff ;;
            preview) pulumi preview --diff ;;
            build-image)
              arn=$(pulumi stack output testbed --json | jq -r .imagePipelineArn)
              aws imagebuilder start-image-pipeline-execution --image-pipeline-arn "$arn"
              echo "::notice title=Image build started::30 to 60 minutes; then run this workflow with action up and groups ticked."
              ;;
          esac
