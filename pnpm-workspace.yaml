# Testbed file contract:
# Purpose: pnpm workspace membership (one package, packages/testbed) and the version catalogs its package.json
#          references resolve against. Versions match figentra/stackra's catalogs at beaafa27; the `stackra` catalog
#          pins the shared presets and @stackra/console (with @stackra/validation) from the Stackra registry (.npmrc).
# Owner: release-operations
# Secrets: forbidden
packages:
  - packages/*

catalogMode: strict
engineStrict: true

catalog:
  "@types/node": 26.6.4
  # The plan's schemas (testbedPlan's input).
  zod: 4.6.7
  # Figentra Flow: the gate, worktrees and specs (flow.config.json), from the Figentra registry's open scope.
  "@figentra-oss/flow": 0.2.3

catalogs:
  build:
    turbo: 2.11.9
    typescript: 7.0.2
    tsdown: 0.23.1
  quality:
    oxlint: 1.86.0
    oxfmt: 0.71.0
    vitest: 5.0.5
    "@vitest/coverage-v8": 5.0.3
  release:
    "@changesets/cli": 3.0.3
    "@changesets/changelog-git": 1.0.0
    "@commitlint/cli": 21.2.3
    lefthook: 2.2.1
  # The Pulumi program's providers; `pulumi` in mise.toml is the CLI that runs it.
  infra:
    "@pulumi/aws": 7.50.0
    "@pulumi/pulumi": 3.268.0
  # The shared presets and the console engine the `testbed` CLI runs on, published from figentra/stackra to the
  # Stackra registry (exact, never a range). @stackra/console 0.9.0 carries `json: "bare"`, `requireCommand` and
  # `inherit` (ADR 0506 amendment of 2026-11-03).
  stackra:
    "@stackra/commitlint-config": 0.8.0
    "@stackra/console": 0.9.0
    "@stackra/tsdown-config": 0.8.0
    "@stackra/typescript-config": 0.8.0
    "@stackra/validation": 0.9.0
    "@stackra/vitest-config": 0.8.0

# Install scripts allowed to run (reviewed, as figentra/stackra reviews them); any other fails install with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  lefthook: true
  # Pulled in by @pulumi/pulumi through @grpc/proto-loader: its postinstall only serves its CLI.
  protobufjs: false
# Our own releases from the Stackra registry, exact versions only, as figentra/stackra lists its own.
minimumReleaseAgeExclude:
  - "@figentra-oss/flow@0.2.3"
  - "@stackra/commitlint-config@0.8.0"
  - "@stackra/console@0.9.0"
  # @stackra/console's own dependencies from the same release.
  - "@stackra/container@0.9.0"
  - "@stackra/contracts@0.9.0"
  - "@stackra/tsdown-config@0.8.0"
  - "@stackra/typescript-config@0.8.0"
  - "@stackra/validation@0.9.0"
  - "@stackra/vitest-config@0.8.0"
